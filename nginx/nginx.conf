server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Re-resolve "app" through Docker's embedded DNS instead of once at nginx
    # startup: a rebuilt/recreated app container gets a new IP, and a cached
    # one made every request 502 until nginx was restarted. A variable in
    # proxy_pass is what makes nginx honor the resolver at request time
    # (no URI part, so the original request URI is passed through unchanged).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:8100;

    location / {
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Log Search can legitimately take up to LOG_SEARCH_TIMEOUT (60s)
        # plus submit round-trip overhead — keep Nginx's own timeout well
        # clear of that so a slow-but-successful search gets the app's own
        # descriptive JSON error/response instead of Nginx's generic 504.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
