[project]
name = "4tlog"
version = "0.1.0"
description = "Flask web application for FortiAnalyzer dashboarding and log search."
readme = "readme.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
    "python-dotenv>=1.0",
    "bcrypt>=4.1",
    "requests>=2.31",
    "apscheduler>=3.11.2",
    "pysnmp>=7.1.27",
    "cryptography>=50.0.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
prod = ["gunicorn>=22"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

