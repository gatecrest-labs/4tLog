services:
  app:
    build: .
    image: 4tlog:latest
    container_name: 4tlog
    restart: unless-stopped
    expose:
      - "8100"
    env_file:
      - .env
      # TLS terminates at the nginx service below, so set in .env:
      #   COOKIE_SECURE=true
      #   TRUSTED_PROXY_COUNT=1
    volumes:
      - ./users.json:/app/users.json:rw
      - ./groups.json:/app/groups.json:rw
      - ./faz_targets.json:/app/faz_targets.json:rw
      - ./app_settings.json:/app/app_settings.json:rw
      - ./api_tokens.json:/app/api_tokens.json:rw
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8100/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    container_name: 4tlog-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8300:443"
      - "8301:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
